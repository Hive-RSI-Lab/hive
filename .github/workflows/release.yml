name: release
# The Hive creates its own releases (gh release create) after a kept merge
# whose tests and dry run passed; this builds and attaches the binaries.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; name=hive-$os-$arch
            [ "$os" = windows ] && name=$name.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/ihsan-sa/hive/internal/core.Version=$TAG -X github.com/ihsan-sa/hive/internal/core.DefaultReleaseRepo=$REPO" \
              -o dist/$name ./cmd/hive
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
