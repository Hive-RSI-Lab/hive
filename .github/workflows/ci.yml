name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short ./...
      - name: end-to-end (fake harness, local forge)
        run: go test ./internal/e2e/ -timeout 30m
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
